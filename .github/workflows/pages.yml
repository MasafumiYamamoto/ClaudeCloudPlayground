name: pages

on:
  push:
    branches: ['main']
  # Pages の設定直後など、手動でも配信できるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は同時に 1 つだけ。進行中のデプロイは中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # 壊れた状態を配信しないよう、デプロイ前にテストを通す
      - name: Run tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ビルドが無いのでリポジトリの中身をそのまま配信する
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
